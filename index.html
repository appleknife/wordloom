<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F2E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15140F" media="(prefers-color-scheme: dark)">
<meta name="description" content="Wordloom — one good word a day, learned properly. Works offline, no accounts.">
<title>Wordloom — a word a day, well learned</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --paper:#F7F2E8; --paper-2:#FFFDF8; --paper-3:#F1E9DB;
  --ink:#232019; --ink-soft:#5D5548; --ink-faint:#8E8474;
  --line:#E4DAC9; --line-soft:#EDE4D5;
  --accent:#2E5D4E; --accent-ink:#F6F2E6; --accent-soft:#DDE7DF;
  --gold:#A9834B; --rose:#A65A51;
  --shadow:0 1px 2px rgba(35,32,25,.05), 0 14px 34px -16px rgba(35,32,25,.30);
  --shadow-sm:0 1px 2px rgba(35,32,25,.06);
  --serif:"Fraunces",Georgia,"Iowan Old Style","Times New Roman",serif;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --r:24px;
  --pad:18px;
}
[data-theme="dark"]{
  --paper:#15140F; --paper-2:#1D1B15; --paper-3:#252219;
  --ink:#F1EBDD; --ink-soft:#C4BBAB; --ink-faint:#8C8271;
  --line:#332F27; --line-soft:#2A2720;
  --accent:#93C4A9; --accent-ink:#13201A; --accent-soft:#23322B;
  --gold:#D3AA6B; --rose:#D98C81;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 18px 40px -18px rgba(0,0,0,.7);
  --shadow-sm:0 1px 2px rgba(0,0,0,.35);
}
html{-webkit-text-size-adjust:100%;font-size:16px;scroll-behavior:smooth}
html[data-size="lg"]{font-size:17.5px}
html[data-size="xl"]{font-size:19px}
body{
  margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(120% 55% at 50% -8%,rgba(169,131,75,.11),transparent 65%);
  background-attachment:fixed;min-height:100dvh;overflow-x:hidden;
}
[data-theme="dark"] body{background-image:radial-gradient(120% 55% at 50% -8%,rgba(147,196,169,.07),transparent 65%)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
h1,h2,h3,p,blockquote{margin:0}
::selection{background:var(--accent-soft);color:var(--ink)}

.app{max-width:520px;margin:0 auto;padding:0 var(--pad) calc(96px + env(safe-area-inset-bottom));position:relative}
@media (min-width:560px){.app{padding-left:24px;padding-right:24px}}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 0 10px;position:sticky;top:0;z-index:20;
  background:linear-gradient(var(--paper) 72%,rgba(247,242,232,0));}
[data-theme="dark"] .top{background:linear-gradient(var(--paper) 72%,rgba(21,20,15,0))}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:1.06rem;letter-spacing:.01em;font-weight:500}
.brand svg{width:26px;height:26px;color:var(--accent)}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink-soft)}
.topbtns{display:flex;align-items:center;gap:2px}
.iconbtn.off{color:var(--ink-faint);opacity:.7}
.vol{display:flex;align-items:center;gap:10px}
.vol input[type=range]{-webkit-appearance:none;appearance:none;width:92px;height:4px;border-radius:2px;background:var(--line);outline:none}
.vol input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);border:0;box-shadow:var(--shadow-sm)}
.vol input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--accent)}
.sw{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;border:0;padding:0;flex:0 0 auto;transition:background .2s}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--paper-2);box-shadow:var(--shadow-sm);transition:transform .2s}
.sw.on{background:var(--accent)}
.sw.on i{transform:translateX(18px)}
.iconbtn:hover{background:var(--paper-3)}
.iconbtn svg{width:21px;height:21px}

/* ---------- views ---------- */
main{display:block;padding-top:4px}
.view{animation:fadeUp .38s cubic-bezier(.2,.7,.3,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.kicker{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);font-weight:500}
.daybar{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:2px 2px 14px}
.daybar .date{font-family:var(--serif);font-size:1rem;color:var(--ink-soft);line-height:1.3}
.daybar .date small{display:block;font-family:var(--sans);font-size:.72rem;letter-spacing:.02em;color:var(--ink-faint);margin-top:3px}
.streak{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--ink-soft);background:var(--paper-3);border:1px solid var(--line-soft);padding:5px 10px;border-radius:999px;white-space:nowrap}
.streak b{color:var(--ink);font-weight:600}
.flame{width:13px;height:13px;color:var(--gold)}

/* ---------- word card ---------- */
.card{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);position:relative;overflow:hidden}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:radial-gradient(120% 80% at 100% 0,rgba(169,131,75,.07),transparent 55%)}
.wordcard{padding:26px 22px 24px}
.wordline{display:flex;align-items:center;gap:12px;justify-content:space-between}
.word{font-family:var(--serif);font-weight:500;font-size:clamp(2.5rem,11.5vw,3.4rem);line-height:1.02;letter-spacing:-.025em;overflow-wrap:anywhere}
.speak{flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--accent);background:var(--paper);transition:transform .18s,background .18s}
.speak:active{transform:scale(.94)}
.speak.playing{background:var(--accent-soft)}
.speak svg{width:19px;height:19px}
.meta{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:14px;font-size:.82rem;color:var(--ink-soft)}
.pos{font-style:italic;font-family:var(--serif);font-size:.92rem}
.pron{letter-spacing:.02em;color:var(--ink-soft)}
.meta .sep{color:var(--line);}
.chip{font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink-faint);background:var(--paper)}
.chip.useful{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 30%,var(--line));background:var(--accent-soft)}
.chip.stretch{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 30%,var(--line))}

.detail{margin-top:22px;display:grid;gap:16px}
.plain{font-family:var(--serif);font-size:1.32rem;line-height:1.4;letter-spacing:-.005em}
.formal{font-size:.92rem;line-height:1.5;color:var(--ink-soft);padding-left:12px;border-left:2px solid var(--line)}
.ex{font-family:var(--serif);font-style:italic;font-size:1.05rem;line-height:1.55;color:var(--ink);padding-left:14px;border-left:2px solid var(--accent)}
.ex .hl{font-style:normal;font-weight:600;background:linear-gradient(transparent 62%,var(--accent-soft) 62%);padding:0 1px}
.swap{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.9rem;color:var(--ink-soft);background:var(--paper-3);border-radius:12px;padding:10px 12px}
.swap em{font-family:var(--serif);font-style:italic;color:var(--ink);font-size:.98rem}
.swap .arrow{color:var(--ink-faint)}
.root{font-size:.76rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint)}

.revealbox{margin-top:22px;display:grid;gap:10px;justify-items:stretch;text-align:center;padding:6px 0 2px}
.hint{font-size:.82rem;color:var(--ink-faint)}
.revealbtn{min-height:50px;border-radius:14px;border:1px dashed color-mix(in srgb,var(--accent) 40%,var(--line));color:var(--accent);font-weight:500;font-size:.95rem;background:color-mix(in srgb,var(--accent-soft) 60%,transparent)}
.revealbtn:active{transform:scale(.99)}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.btn{min-height:54px;border-radius:15px;font-weight:600;font-size:.97rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,filter .15s}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow-sm)}
.btn-ghost{background:var(--paper-2);border:1px solid var(--line);color:var(--ink-soft)}
.btn-quiet{background:var(--paper-3);color:var(--ink-soft);border:1px solid var(--line-soft)}
.btn.block{width:100%}
.btn svg{width:18px;height:18px}

.afterbar{margin-top:14px;text-align:center;font-size:.8rem;color:var(--ink-faint)}
.afterbar b{color:var(--ink-soft);font-weight:500}

/* week strip */
.week{display:flex;gap:6px;justify-content:space-between;margin:16px 2px 0}
.week .d{flex:1;display:grid;justify-items:center;gap:6px;font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}
.week .dot{width:100%;height:26px;border-radius:8px;border:1px solid var(--line);background:var(--paper-2)}
.week .dot.on{background:color-mix(in srgb,var(--accent) 78%,var(--paper-2));border-color:transparent}
.week .dot.today{border-color:var(--accent);border-width:1.5px}
.week .dot.today.on{border-color:transparent}

/* ---------- garden ---------- */
.ghead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px}
.ghead h2{font-family:var(--serif);font-weight:500;font-size:1.6rem;letter-spacing:-.02em;line-height:1.15}
.ghead p{font-size:.82rem;color:var(--ink-faint);margin-top:4px}
.ring{width:64px;height:64px;flex:0 0 auto;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-size:.72rem;color:var(--ink-soft);font-weight:600}
.garden{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:12px 8px}
.plot{display:grid;justify-items:center;gap:6px;padding:8px 2px;border-radius:14px}
.plot:active{background:var(--paper-3)}
.plot svg{width:100%;max-width:54px;height:auto;display:block}
.plot .nm{font-family:var(--serif);font-size:.76rem;color:var(--ink-soft);text-align:center;line-height:1.2;overflow-wrap:anywhere}
.plot.new .nm{color:var(--ink-faint)}
.empty{text-align:center;padding:44px 18px;border:1px dashed var(--line);border-radius:var(--r);color:var(--ink-faint);font-size:.9rem;line-height:1.6}
.empty .big{font-family:var(--serif);font-size:1.2rem;color:var(--ink-soft);margin-bottom:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:18px 0 4px;font-size:.72rem;color:var(--ink-faint)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}

/* ---------- review ---------- */
.qcard{padding:24px 20px}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.qprog{display:flex;gap:5px}
.qprog i{width:22px;height:4px;border-radius:2px;background:var(--line)}
.qprog i.done{background:var(--accent)}
.qprog i.miss{background:var(--rose)}
.qword{font-family:var(--serif);font-size:1.9rem;letter-spacing:-.02em;line-height:1.15;margin-bottom:6px}
.qsub{font-size:.85rem;color:var(--ink-faint);margin-bottom:20px}
.opts{display:grid;gap:9px}
.opt{text-align:left;padding:14px 15px;border-radius:14px;border:1px solid var(--line);background:var(--paper);font-size:.95rem;line-height:1.4;transition:background .15s,border-color .15s,transform .12s}
.opt:active{transform:scale(.995)}
.opt.right{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.opt.wrong{border-color:var(--rose);background:color-mix(in srgb,var(--rose) 12%,var(--paper))}
.opt[disabled]{cursor:default}
.opt .mark{float:right;font-weight:700;color:var(--accent)}
.opt.wrong .mark{color:var(--rose)}
.feedback{margin-top:16px;padding-top:16px;border-top:1px solid var(--line-soft);display:grid;gap:10px;animation:fadeUp .3s both}
.feedback .plain{font-size:1.02rem}

/* ---------- words list ---------- */
.searchrow{display:flex;gap:8px;margin-bottom:12px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--paper-2);border:1px solid var(--line);border-radius:14px;padding:0 12px;min-height:46px}
.search svg{width:17px;height:17px;color:var(--ink-faint);flex:0 0 auto}
.search input{border:0;background:none;outline:none;font:inherit;font-size:16px;color:var(--ink);width:100%}
.search input::placeholder{color:var(--ink-faint)}
.filters{display:flex;gap:7px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{padding:7px 13px;border-radius:999px;border:1px solid var(--line);font-size:.78rem;color:var(--ink-soft);white-space:nowrap;background:var(--paper-2)}
.fchip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.wlist{display:grid;gap:8px}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;text-align:left;padding:13px 15px;border-radius:15px;border:1px solid var(--line-soft);background:var(--paper-2);width:100%}
.wrow > span:first-child{min-width:0}
.wrow:active{background:var(--paper-3)}
.wrow .w{font-family:var(--serif);font-size:1.08rem;letter-spacing:-.01em}
.wrow .d{font-size:.79rem;color:var(--ink-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.state{width:8px;height:8px;border-radius:50%;background:var(--line);flex:0 0 auto}
.state.s1{background:color-mix(in srgb,var(--accent) 45%,var(--line))}
.state.s2{background:var(--accent)}
.state.due{background:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 22%,transparent)}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,18,14,.42);backdrop-filter:blur(2px);z-index:40;animation:fadeIn .2s both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--paper);border-radius:26px 26px 0 0;box-shadow:0 -18px 50px -20px rgba(0,0,0,.5);
  max-width:520px;margin:0 auto;max-height:88dvh;overflow:auto;padding:10px 20px calc(24px + env(safe-area-inset-bottom));animation:sheetUp .34s cubic-bezier(.2,.8,.25,1) both}
@keyframes sheetUp{from{transform:translateY(26px)}to{transform:none}}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 14px}
.sheet h3{font-family:var(--serif);font-weight:500;font-size:1.3rem;letter-spacing:-.01em}
.sheet .srow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line-soft)}
.sheet .srow:last-of-type{border-bottom:0}
.sheet .srow .lbl{font-size:.92rem}
.sheet .srow .sub{font-size:.76rem;color:var(--ink-faint);margin-top:2px}
.seg{display:inline-flex;background:var(--paper-3);border-radius:11px;padding:3px;border:1px solid var(--line-soft)}
.seg button{padding:6px 11px;border-radius:9px;font-size:.78rem;color:var(--ink-soft)}
.seg button.on{background:var(--paper-2);color:var(--ink);box-shadow:var(--shadow-sm)}
.sheetfoot{display:grid;gap:10px;margin-top:18px}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--paper);font-size:.85rem;
  padding:10px 16px;border-radius:999px;box-shadow:var(--shadow);animation:toastIn .25s both;max-width:86vw;text-align:center}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

/* ---------- tab bar ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;max-width:520px;margin:0 auto;
  background:color-mix(in srgb,var(--paper-2) 88%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line-soft);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tab{flex:1;display:grid;justify-items:center;gap:3px;padding:6px 0;border-radius:12px;color:var(--ink-faint);font-size:.63rem;letter-spacing:.04em}
.tab svg{width:22px;height:22px;stroke-width:1.6}
.tab.on{color:var(--accent)}
.tab .badge{position:absolute;transform:translate(14px,-8px);background:var(--gold);color:#231f18;font-size:.6rem;font-weight:700;min-width:16px;height:16px;border-radius:999px;display:grid;place-items:center;padding:0 4px}
.tab{position:relative}

/* ---------- streak rests & chapters ---------- */
.week .dot.rest{background:color-mix(in srgb,var(--gold) 28%,var(--paper-2));border-color:color-mix(in srgb,var(--gold) 50%,var(--line))}
.welcome{font-size:.85rem;color:var(--ink-soft);background:var(--accent-soft);border-radius:12px;padding:10px 12px;margin-bottom:14px;line-height:1.5}
.chapter{margin-top:14px}
.chapter .row{display:flex;justify-content:space-between;gap:10px;font-size:.72rem;color:var(--ink-faint);letter-spacing:.03em;margin-bottom:6px}
.chapter .bar{height:5px;border-radius:3px;background:var(--line-soft);overflow:hidden}
.chapter .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 45%,var(--gold)));border-radius:3px;transition:width .5s cubic-bezier(.2,.8,.3,1)}

/* ---------- onboarding ---------- */
.onboard{min-height:calc(100dvh - 190px);display:flex;flex-direction:column;justify-content:center;gap:24px;padding:10px 0 24px}
.onboard h1{font-family:var(--serif);font-size:clamp(1.8rem,7.4vw,2.3rem);line-height:1.14;letter-spacing:-.025em;font-weight:500}
.onboard p{color:var(--ink-soft);font-size:.92rem;line-height:1.6}
.field{display:grid;gap:8px}
.field label{font-size:.7rem;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint)}
.field input{min-height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--paper-2);padding:0 14px;font:inherit;font-size:1rem;color:var(--ink);outline:none;width:100%}
.field input:focus{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--paper-2);font-size:.86rem;color:var(--ink-soft)}
.chips button.on{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.dots{display:flex;gap:6px;justify-content:center;padding-top:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}

/* ---------- play ---------- */
.hub{display:grid;gap:12px}
.bigcard{padding:20px;border-radius:20px;border:1px solid var(--line);background:var(--paper-2);box-shadow:var(--shadow-sm);display:grid;gap:8px;text-align:left;width:100%}
.bigcard:active{background:var(--paper-3)}
.bigcard h3{font-family:var(--serif);font-size:1.2rem;font-weight:500;letter-spacing:-.01em}
.bigcard p{font-size:.86rem;color:var(--ink-soft);line-height:1.55}
.tally{display:flex;align-items:center;justify-content:center;gap:22px;padding:18px;border-radius:20px;border:1px solid var(--line);background:var(--paper-2)}
.tally .side{text-align:center;min-width:64px}
.tally .num{font-family:var(--serif);font-size:2.3rem;line-height:1;font-weight:500}
.tally .who{font-size:.68rem;color:var(--ink-faint);letter-spacing:.1em;text-transform:uppercase;margin-top:6px}
.tally .dash{color:var(--line);font-size:1.2rem}
.turnchip{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:6px 11px;border-radius:999px}
.pass{text-align:center;padding:34px 22px;display:grid;gap:6px}
.pass .who{font-family:var(--serif);font-size:1.7rem;line-height:1.2;margin:10px 0 2px}
.result{text-align:center;padding:28px 22px}
.result .score{font-family:var(--serif);font-size:3.2rem;letter-spacing:-.03em;line-height:1;font-weight:500}
.result .line{font-size:.9rem;color:var(--ink-soft);margin-top:12px;line-height:1.5}
.linkbox{width:100%;margin-top:14px;font:inherit;font-size:.78rem;line-height:1.45;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--paper-2);color:var(--ink-soft);resize:none;word-break:break-all}

/* ---------- cloze & typing ---------- */
.blank{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--accent);color:transparent}
.typebox{display:grid;gap:10px}
.typebox input{width:100%;min-height:54px;border-radius:14px;border:1.5px solid var(--line);background:var(--paper);padding:0 14px;font-family:var(--serif);font-size:1.2rem;color:var(--ink);outline:none}
.typebox input:focus{border-color:var(--accent)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>

/* ---------------- sound ---------------- */
let AC = null, master = null;

function audio(){
  if (!S.settings.sound) return null;
  try {
    if (!AC){
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      AC = new Ctx();
      master = AC.createGain();
      master.connect(AC.destination);
    }
    if (AC.state === 'suspended') AC.resume();
    master.gain.value = S.settings.soundVol == null ? 0.6 : S.settings.soundVol;
    return AC;
  } catch (e) { return null; }
}

function tone(freq, o){
  const ctx = audio(); if (!ctx) return;
  o = o || {};
  const t0 = ctx.currentTime + (o.delay || 0);
  const dur = o.dur || 0.28;
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = o.type || 'sine';
  osc.frequency.setValueAtTime(freq, t0);
  if (o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(30, o.to), t0 + dur);
  const peak = o.gain == null ? 0.16 : o.gain;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(peak, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g); g.connect(master);
  osc.start(t0); osc.stop(t0 + dur + 0.05);
}

function noiseBurst(dur, gain){
  const ctx = audio(); if (!ctx) return;
  const len = Math.max(1, Math.floor(ctx.sampleRate * dur));
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
  const src = ctx.createBufferSource(); src.buffer = buf;
  const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1900; f.Q.value = 0.7;
  const g = ctx.createGain(); g.gain.value = gain || 0.04;
  src.connect(f); f.connect(g); g.connect(master); src.start();
}

function sfxOn(cat){ return S.settings.sound && S.settings.cats[cat] !== false; }

/* soft, warm, and short. No buzzers. */
const SFX = {
  /* ---- interface ---- */
  tap(){ if (!sfxOn('ui')) return; tone(784, { dur: 0.06, gain: 0.045, type: 'triangle' }); },
  open(){
    if (!sfxOn('ui')) return;
    tone(587.33, { dur: 0.14, gain: 0.055, type: 'triangle' });
    tone(880, { dur: 0.16, gain: 0.032, delay: 0.05 });
  },
  close(){ if (!sfxOn('ui')) return; tone(523.25, { dur: 0.16, gain: 0.05, type: 'triangle', to: 392 }); },
  page(){ if (!sfxOn('ui')) return; noiseBurst(0.16, 0.028); },
  pass(){
    if (!sfxOn('ui')) return;
    tone(659.25, { dur: 0.18, gain: 0.06 });
    tone(493.88, { dur: 0.24, gain: 0.05, delay: 0.12 });
  },
  round(){
    if (!sfxOn('ui')) return;
    tone(587.33, { dur: 0.12, gain: 0.05 });
    tone(783.99, { dur: 0.14, gain: 0.05, delay: 0.1 });
  },
  pluck(stage){
    if (!sfxOn('ui')) return;
    const f = [392, 523.25, 659.25, 783.99, 987.77][Math.min(stage || 0, 4)];
    tone(f, { dur: 0.26, gain: 0.075, type: 'triangle' });
    tone(f * 2, { dur: 0.12, gain: 0.018, delay: 0.01 });
  },

  /* ---- answers ---- */
  right(combo){
    if (!sfxOn('answer')) return;
    const scale = [523.25, 587.33, 659.25, 783.99, 880, 1046.5];
    const f = scale[Math.min(Math.max(combo || 1, 1) - 1, scale.length - 1)];
    tone(f, { dur: 0.36, gain: 0.15 });
    tone(f * 1.5, { dur: 0.34, gain: 0.05, type: 'triangle', delay: 0.015 });
    tone(f * 2, { dur: 0.22, gain: 0.035, delay: 0.02 });
  },
  wrong(){
    if (!sfxOn('answer')) return;
    tone(196, { dur: 0.34, gain: 0.1, to: 150 });
    tone(294, { dur: 0.2, gain: 0.03, to: 220 });
  },
  keep(){
    if (!sfxOn('answer')) return;
    tone(523.25, { dur: 0.5, gain: 0.12 });
    tone(783.99, { dur: 0.55, gain: 0.085, delay: 0.09 });
  },
  note(){ if (!sfxOn('answer')) return; tone(392, { dur: 0.2, gain: 0.075, type: 'triangle' }); },

  /* ---- celebrations ---- */
  flourish(){
    if (!sfxOn('reward')) return;
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, { dur: 0.6, gain: 0.095, delay: i * 0.1 }));
  },
  win(){
    if (!sfxOn('reward')) return;
    [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => tone(f, { dur: 0.55, gain: 0.095, delay: i * 0.085 }));
  },
  lose(){
    if (!sfxOn('reward')) return;
    [440, 392, 329.63].forEach((f, i) => tone(f, { dur: 0.45, gain: 0.07, delay: i * 0.11 }));
  }
};

/* iOS will not produce a sound until the audio context has been unlocked
   inside a real gesture, so do that on the first touch of anything. */
function unlockAudio(){
  const ctx = audio();
  if (!ctx) return;
  try {
    if (AC.state === 'suspended') AC.resume();
    const b = AC.createBuffer(1, 1, 22050);
    const s = AC.createBufferSource();
    s.buffer = b; s.connect(AC.destination); s.start(0);
  } catch (e) {}
}
document.addEventListener('pointerdown', unlockAudio, { once: true });

const st = id => S.words[id] || (S.words[id] = { n: 0, l: 0, due: null, last: null });
const cls = id => S.words[id] || { n: 0, l: 0 };
const metList = () => WORDS.filter(w => { const s = S.words[w.w]; return s && s.n > 0; });
function dueList(){
  const t = todayISO();
  return WORDS.filter(w => { const s = S.words[w.w]; return s && s.n > 0 && s.due && s.due <= t; })
              .sort((a, b) => (S.words[a.w].due < S.words[b.w].due ? -1 : 1));
}

/* how badly does this word need another look? */
function needScore(w){
  const s = S.words[w.w]; if (!s || !s.n) return -1;
  const late = s.due ? Math.max(0, diffDays(s.due, todayISO())) : 0;
  return late * 2 + (s.x || 0) * 5 + (6 - (s.l || 0)) * 2 + (s.again ? 40 : 0);
}

/* Built by need, not calendar order; weak words are pulled forward even
   when they are not strictly due yet. */
function reviewQueue(limit){
  const t = todayISO();
  const due = WORDS.filter(w => { const s = S.words[w.w]; return s && s.n > 0 && s.due && s.due <= t; });
  const queue = due.slice().sort((a, b) => needScore(b) - needScore(a)).map(w => w.w);

  if (queue.length < 5){
    const weak = metList()
      .filter(w => {
        const s = S.words[w.w];
        return (s.x || 0) >= 2 && (!s.last || s.last < t) && !queue.includes(w.w);
      })
      .sort((a, b) => needScore(b) - needScore(a))
      .slice(0, 5 - queue.length)
      .map(w => w.w);
    queue.push(...weak);
  }
  return queue.slice(0, limit);
}

/* ---------------- queue & day ---------------- */
function buildQueue(){
  const rnd = mulberry32(S.seed + (S.builds || 0) * 7919);
  S.builds = (S.builds || 0) + 1;
  const pick = (arr) => { const a = arr.slice(); for (let i = a.length-1; i > 0; i--){ const j = Math.floor(rnd() * (i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
  const useful = pick(WORDS.filter(w => w.lane === 'useful').map(w => w.w));
  const stretch = pick(WORDS.filter(w => w.lane === 'stretch').map(w => w.w));
  const ratio = S.settings.mix === 'useful' ? 3 : S.settings.mix === 'stretch' ? 1 : 2;
  const out = [];
  let i = 0, j = 0;
  while (i < useful.length || j < stretch.length){
    for (let k = 0; k < ratio && i < useful.length; k++) out.push(useful[i++]);
    if (j < stretch.length) out.push(stretch[j++]);
    if (i >= useful.length && j < stretch.length){ while (j < stretch.length) out.push(stretch[j++]); }
  }
  S.queue = out; S.ptr = 0;
}
function nextId(){
  if (!S.queue || !S.queue.length || (S.ptr || 0) >= S.queue.length) buildQueue();
  return S.queue[S.ptr++];
}
function ensureToday(){
  const d = todayISO();
  if (!S.today || S.today.date !== d || !BY_ID.has(S.today.id)){
    S.today = { date: d, id: nextId() };
    save();
  }
}

/* ---------------- streak: two rest days per week ---------------- */
function streakInfo(){
  const set = new Set(S.days);
  if (!set.size) return { span: 0, kept: 0, rests: [], pending: true };
  let d = todayISO();
  let pending = !set.has(d);
  if (pending) d = addDays(d, -1);
  let kept = 0, span = 0, rests = [];
  let guard = 0;
  while (guard++ < 400){
    if (set.has(d)){ kept++; span++; }
    else {
      if (kept === 0) break;
      const recent = rests.filter(r => diffDays(d, r) < 7).length;
      if (recent >= 2) break;
      rests.push(d); span++;
    }
    d = addDays(d, -1);
    if (d < S.created) break;
  }
  if (!kept) return { span: 0, kept: 0, rests: [], pending: true };
  return { span: span + (pending ? 1 : 0), kept, rests, pending };
}
function markDay(){
  const d = todayISO();
  if (!S.days.includes(d)) S.days.push(d);
  const info = streakInfo();
  S.best = Math.max(S.best || 0, info.span);
}

/* ---------------- chapter ---------------- */
function chapterInfo(){
  const total = WORDS.length;
  const met = metList().length;
  // the final chapter is short when the bank does not divide evenly
  let n = 1, start = 0;
  while (start + CHAPTER <= met && start + CHAPTER < total){ start += CHAPTER; n++; }
  const size = Math.min(start + CHAPTER, total) - start;
  const inCh = met - start;
  const finale = met === total;
  return {
    n, met: inCh, size,
    pct: Math.round((inCh / size) * 100),
    finale,
    done: met > 0 && (finale || met % CHAPTER === 0),
    doneN: finale ? n : n - 1
  };
}

/* ---------------- marking ---------------- */
function markWord(id, ok){
  const w = st(id);
  w.n = (w.n || 0) + 1;
  if (ok){
    w.x = Math.max(0, (w.x || 0) - 1);
    w.l = Math.min((w.l || 0) + 1, INTERVALS.length - 1);
    w.due = addDays(todayISO(), INTERVALS[w.l]);
  } else {
    w.x = (w.x || 0) + 1;
    /* a word you keep missing falls further, and comes back sooner */
    w.l = Math.max(0, (w.l || 0) - (w.x >= 3 ? 2 : 1));
    w.due = addDays(todayISO(), w.x >= 3 ? 0 : 1);
  }
  w.again = !ok;
  w.last = todayISO();
  markDay(); save();
  checkChapter();
  return w;
}

/* missed words come back before the session ends */
function requeue(id){
  if (!ui.rq) return;
  if (ui.rq.filter(x => x === id).length >= 2) return;
  const at = Math.min(ui.ri + 3, ui.rq.length);
  ui.rq.splice(at, 0, id);
}

function checkChapter(){
  const ch = chapterInfo();
  if (ch.done && S.celebrated !== ch.doneN){
    S.celebrated = ch.doneN;
    save();
    SFX.flourish();
    toast(`Chapter ${ch.doneN} complete`);
  }
}
function whenBack(due){
  const n = diffDays(todayISO(), due);
  if (n <= 1) return 'tomorrow';
  if (n < 7) return `in ${n} days`;
  if (n < 14) return 'in a week';
  if (n < 30) return `in ${Math.round(n/7)} weeks`;
  return `in ${Math.round(n/30)} month${Math.round(n/30) === 1 ? '' : 's'}`;
}
function statusText(w){
  const s = S.words[w.w];
  if (!s || !s.n) return 'Not met yet';
  const met = `Met ${s.n} time${s.n === 1 ? '' : 's'}` + (s.x ? ` · missed ${s.x} time${s.x === 1 ? '' : 's'}` : '');
  if (s.due && s.due <= todayISO()) return met + ' · due for review';
  if (s.due) return met + ' · back ' + whenBack(s.due);
  return met;
}
function score(w){ const s = S.words[w.w]; return { n: s ? s.n : 0, l: s ? s.l : 0, due: s ? s.due : null }; }

function plantSVG(stage, color){
  const stemH = [0, 10, 18, 24, 26][Math.min(stage, 4)];
  const top = 50 - stemH;
  let leaves = '';
  if (stage >= 1){ leaves += `<ellipse cx="17.5" cy="45.5" rx="6.4" ry="3.1" fill="${color}" opacity=".9" transform="rotate(-22 17.5 45.5)"/>`; leaves += `<ellipse cx="30.5" cy="47" rx="5.6" ry="2.8" fill="${color}" opacity=".55" transform="rotate(22 30.5 47)"/>`; }
  if (stage >= 2){ leaves += `<ellipse cx="16.5" cy="38" rx="6.8" ry="3.2" fill="${color}" opacity=".95" transform="rotate(-28 16.5 38)"/>`; leaves += `<ellipse cx="31.5" cy="35" rx="6.2" ry="3" fill="${color}" opacity=".6" transform="rotate(26 31.5 35)"/>`; }
  if (stage >= 3){ leaves += `<ellipse cx="18" cy="29" rx="5.8" ry="2.8" fill="${color}" opacity=".85" transform="rotate(-32 18 29)"/>`; }
  let head = '';
  if (stage === 3) head = `<circle cx="24" cy="${top - 1.5}" r="4.4" fill="${color}" opacity=".85"/>`;
  if (stage >= 4){
    for (let i = 0; i < 5; i++){
      const a = (i / 5) * Math.PI * 2 - Math.PI / 2;
      head += `<circle cx="${(24 + Math.cos(a) * 5.6).toFixed(1)}" cy="${(top - 2 + Math.sin(a) * 5.6).toFixed(1)}" r="3.5" fill="${color}" opacity=".62"/>`;
    }
    head += `<circle cx="24" cy="${top - 2}" r="2.6" fill="#F2C879"/>`;
  }
  const stem = stage > 0 ? `<path d="M24 50V${top}" stroke="${color}" stroke-width="2.2" stroke-linecap="round" fill="none"/>` : '';
  const seed = stage === 0 ? `<ellipse cx="24" cy="47.5" rx="4" ry="2.9" fill="${color}" opacity=".45"/>` : '';
  return `<svg viewBox="0 0 48 56" aria-hidden="true"><path d="M10 50h28" stroke="var(--line)" stroke-width="2" stroke-linecap="round" opacity=".9"/>${seed}${stem}${leaves}${head}</svg>`;
}
const STAGE = lvl => lvl >= 5 ? 4 : lvl >= 4 ? 3 : lvl >= 2 ? 2 : lvl >= 1 ? 1 : 0;

/* ---------------- text helpers ---------------- */
function stemOf(w){ return w.w.length > 6 ? w.w.slice(0, -2) : w.w; }
function highlight(w){
  try { return w.ex.replace(new RegExp('\\b' + stemOf(w) + '\\w*', 'i'), m => `<span class="hl">${m}</span>`); }
  catch (e) { return esc(w.ex); }
}
function clozeOf(w){
  try {
    const re = new RegExp('\\b(' + stemOf(w) + '\\w*)', 'i');
    const m = re.exec(w.ex);
    if (!m) return null;
    return { before: w.ex.slice(0, m.index), match: m[0], after: w.ex.slice(m.index + m[0].length) };
  } catch (e) { return null; }
}
function clozeHTML(w, filled){
  const c = clozeOf(w);
  if (!c) return esc(w.ex);
  const gap = filled ? `<span class="hl">${esc(c.match)}</span>` : '<span class="blank">____</span>';
  return esc(c.before) + gap + esc(c.after);
}

function detailHTML(w){
  return `<div class="detail">

    <p class="formal">${esc(w.formal)}</p>
    <blockquote class="ex">${highlight(w)}</blockquote>

    <p class="root">${esc(w.root)}</p>

}

function weekHTML(){

  return `<div class="week">${out.join('')}</div>`;
}

/* ---------------- quiz ---------------- */
function makeQuiz(id, force){
  const w = BY_ID.get(id);
  const lvl = cls(id).l;
  let type = force || (lvl >= 4 ? 'type' : lvl >= 2 ? 'cloze' : 'def');
  if (type !== 'def' && !clozeOf(w)) type = 'def';

  if (type === 'def'){
    const pool = WORDS.filter(x => x.w !== id).map(x => x.plain);
    const opts = [w.plain];
    let guard = 0;
    while (opts.length < 4 && guard++ < 500){
      const c = pool[Math.floor(Math.random() * pool.length)];
      if (!opts.includes(c)) opts.push(c);
    }
    shuffle(opts);
    return { id, type, opts, answer: opts.indexOf(w.plain), picked: null, typed: null };
  }

  if (type === 'cloze'){
    const same = WORDS.filter(x => x.w !== id && x.pos === w.pos).map(x => x.w);
    const others = shuffle(same.length >= 6 ? same : WORDS.filter(x => x.w !== id).map(x => x.w)).slice(0, 3);
    const opts = [w.w, ...others];
    shuffle(opts);
    return { id, type, opts, answer: opts.indexOf(w.w), picked: null, typed: null };
  }

  return { id, type, opts: null, answer: -1, picked: null, typed: null };
}

function typedCorrect(input, w){
  const a = norm(input);
  if (!a) return false;
  const base = norm(w.w);
  const c = clozeOf(w);
  const forms = [base, c ? norm(c.match) : base];
  if (forms.includes(a)) return true;
  return base.length >= 6 && lev(a, base) <= 1;
}

/* ---------------- play / duels ---------------- */
function weightedPick(list, weightFn, n){
  const pool = list.slice();
  const out = [];
  while (out.length < n && pool.length){
    const total = pool.reduce((a, w) => a + weightFn(w), 0);
    let r = Math.random() * total, i = 0;
    for (; i < pool.length; i++){ r -= weightFn(pool[i]); if (r <= 0) break; }
    i = Math.min(i, pool.length - 1);
    out.push(pool[i]);
    pool.splice(i, 1);
  }
  return out;
}

/* duels lean on the words he struggles with, so play doubles as practice */
function duelWords(){
  const weight = (w) => {
    const s = cls(w.w);
    if (!s.n) return 1.2;
    let x = 1 + Math.min(s.x || 0, 3) * 1.2;
    if ((s.l || 0) <= 1) x += 1;
    if (s.due && s.due <= todayISO()) x += 1.5;
    return x;
  };
  return weightedPick(WORDS, weight, 5).map(w => w.w);
}

function startDuel(mode, opts){
  opts = opts || {};
  ui.duel = {

    answers: [[], []],
    quiz: null,
    from: opts.from || '',
    target: opts.target || 0,
    lives: mode === 'endless' ? 3 : 0,
    score: 0,
    round: 1,
    beatBest: false
  };
  render();
}

function finishDuel(){
  const d = ui.duel;
  if (d.mode === 'endless'){
    const prev = S.duel.best || 0;
    d.beatBest = d.score > prev;
    S.duel.best = Math.max(prev, d.score);
    save();
  }
  if (d.mode === 'pass' || d.mode === 'challenge'){
    const mine = d.scores[0];
    const theirs = d.mode === 'pass' ? d.scores[1] : d.target;
    if (mine > theirs) S.duel.w++;
    else if (mine < theirs) S.duel.l++;
    else S.duel.t++;
    S.duel.last = { date: todayISO(), a: mine, b: theirs };
    save();
  }
  markDay();
  if (d.mode === 'endless'){ if (d.beatBest) SFX.flourish(); else SFX.lose(); }
  else {
    const mine = d.scores[0];
    const theirs = d.mode === 'pass' ? d.scores[1] : d.target;
    if (mine > theirs) SFX.win(); else if (mine < theirs) SFX.lose(); else SFX.note();
  }
}

/* ---------------- garden ---------------- */
function renderGarden(){
  const met = metList();
  const bloom = met.filter(w => S.words[w.w].l >= 4).length;
  const pct = met.length / WORDS.length;
  const C = 2 * Math.PI * 27;
  const ch = chapterInfo();

  if (!met.length){
    return `<div class="view">
      <div class="ghead"><div><h2>Your garden</h2><p>Every word you meet plants something.</p></div></div>
      <div class="empty"><div class="big">An empty bed of soil.</div>Today's word plants the first seed. It will be a sprout by tomorrow.</div>
    </div>`;
  }

  const sorted = met.slice().sort((a, b) => (S.words[b.w].l - S.words[a.w].l) || a.w.localeCompare(b.w));

  return `<div class="view">
    <div class="ghead">
      <div><h2>Your garden</h2><p>${met.length} of ${WORDS.length} words met · ${bloom} in bloom</p></div>
      <div class="ring">
        <svg width="64" height="64" viewBox="0 0 64 64">
          <circle cx="32" cy="32" r="27" fill="none" stroke="var(--line)" stroke-width="4"/>
          <circle cx="32" cy="32" r="27" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct)}"/>
        </svg>
        <span class="pct">${Math.round(pct * 100)}%</span>
      </div>
    </div>

    ${ch.done ? `<div class="welcome" style="margin-bottom:14px">${ch.finale ? `Chapter ${ch.doneN} complete — every word in the bank planted. You finished the book.` : `Chapter ${ch.doneN} complete — thirty words planted. Chapter ${ch.n} has begun.`}</div>` : ''}

    <div class="garden">
      ${sorted.map(w => {
        const l = S.words[w.w].l;
        return `<button class="plot ${l === 0 ? 'new' : ''}" data-act="open" data-w="${esc(w.w)}">
          ${plantSVG(STAGE(l), THEMES[w.theme].color)}
          <span class="nm">${esc(w.w)}</span>
        </button>`;
      }).join('')}
    </div>
    <div class="legend">
      <span><i style="background:var(--line)"></i>seed</span>
      <span><i style="background:var(--accent);opacity:.55"></i>sprout</span>
      <span><i style="background:var(--accent)"></i>leafing</span>
      <span><i style="background:#F2C879"></i>bloom</span>
    </div>
  </div>`;
}

/* ---------------- words ---------------- */
function renderWords(){
  const q = ui.q.trim().toLowerCase();
  let list = WORDS.slice();
  if (ui.filter === 'useful') list = list.filter(w => w.lane === 'useful');
  if (ui.filter === 'stretch') list = list.filter(w => w.lane === 'stretch');
  if (ui.filter === 'due') list = list.filter(w => dueList().some(d => d.w === w.w));
  if (ui.filter === 'met') list = list.filter(w => cls(w.w).n > 0);
  if (ui.filter === 'new') list = list.filter(w => !cls(w.w).n);
  if (q) list = list.filter(w => w.w.includes(q) || w.plain.toLowerCase().includes(q) || w.swap.toLowerCase().includes(q));
  list.sort((a, b) => a.w.localeCompare(b.w));

  const chips = [['all','All'],['useful','Useful'],['stretch','Stretch'],['due','Due'],['met','Learnt'],['new','Unseen']];

  return `<div class="view">
    <div class="searchrow">
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
        <input id="q" type="search" placeholder="Search ${WORDS.length} words" value="${esc(ui.q)}" autocomplete="off">
      </label>
    </div>
    <div class="filters">${chips.map(([k, l]) => `<button class="fchip ${ui.filter === k ? 'on' : ''}" data-act="filter" data-f="${k}">${l}</button>`).join('')}</div>
    ${list.length ? `<div class="wlist">${list.map(w => {
      const s = S.words[w.w];
      const c = s && s.n ? (s.due && s.due <= todayISO() ? 'due' : (s.l >= 3 ? 's2' : 's1')) : '';
      return `<button class="wrow" data-act="open" data-w="${esc(w.w)}">
        <span><div class="w">${esc(w.w)}</div><div class="d">${esc(w.plain)}</div></span>
        <span class="state ${c}"></span>
      </button>`;
    }).join('')}</div>` : `<div class="empty">No words match that.</div>`}
  </div>`;
}

/* ---------------- sheets ---------------- */
function openSheet(html){
  const sh = $('#sheet');
  sh.innerHTML = `<div class="grab"></div>` + html;
  sh.hidden = false; $('#scrim').hidden = false;
  document.body.style.overflow = 'hidden';
  SFX.open();
}
function closeSheet(){
  const wasOpen = !$('#sheet').hidden;
  $('#sheet').hidden = true; $('#scrim').hidden = true;
  document.body.style.overflow = '';
  if (wasOpen) SFX.close();
}

function wordSheet(w){
  const s = cls(w.w);
  const met = s.n > 0;
  return `<div class="wordline" style="margin-bottom:4px">
      <h1 class="word" style="font-size:2.1rem">${esc(w.w)}</h1>
      <button class="speak" data-act="speak" data-w="${esc(w.w)}" aria-label="Hear ${esc(w.w)}">${ICON_SPEAK}</button>
    </div>
    <div class="meta" style="margin-top:6px">
      <span class="pos">${esc(w.pos)}</span><span class="sep">·</span><span class="pron">${esc(w.p)}</span>
      <span class="chip ${w.lane}">${w.lane}</span>
    </div>
    ${detailHTML(w)}
    <p class="root" style="margin-top:18px;color:var(--ink-faint)">${esc(statusText(w))}</p>
    <div class="sheetfoot">
      ${met ? `<div class="actions" style="margin-top:0">
          <button class="btn btn-ghost" data-act="snotyet" data-w="${esc(w.w)}">Not quite</button>
          <button class="btn btn-primary" data-act="sknew" data-w="${esc(w.w)}">Got it</button>
        </div>
        <div class="actions" style="grid-template-columns:1fr 1fr;margin-top:0">
          <button class="btn btn-quiet" data-act="seasy" data-w="${esc(w.w)}">Too easy</button>
          <button class="btn btn-quiet" data-act="shard" data-w="${esc(w.w)}">Too hard</button>
        </div>`
      : `<button class="btn btn-primary block" data-act="sstart" data-w="${esc(w.w)}">Add to my reviews</button>`}
      <button class="btn btn-quiet block" data-act="close">Close</button>

}

function linkSheet(url){
  const canShare = !!navigator.share;
  return `<h3>Send the challenge</h3>
    <p style="font-size:.86rem;color:var(--ink-soft);margin-top:8px;line-height:1.55">Text this link to ${esc(S.profile.rival || 'them')}. It opens Wordloom on the same five words, with your score already on the table.</p>
    <textarea id="linktext" class="linkbox" readonly rows="4">${esc(url)}</textarea>
    <div class="sheetfoot">
      <button class="btn btn-primary block" data-act="copy-link">Copy link</button>
      ${canShare ? `<button class="btn btn-ghost block" data-act="share-link">Share…</button>` : ''}
      <button class="btn btn-quiet block" data-act="close">Close</button>

}

  const met = metList().length;
  const days = S.days.length;
  const info = streakInfo();
  const seg = (k, opts) => `<div class="seg">${opts.map(([v, l]) => `<button class="${S.settings[k] === v ? 'on' : ''}" data-act="set" data-k="${k}" data-v="${v}">${l}</button>`).join('')}</div>`;
  const sw = (k) => `<button class="sw ${S.settings.cats[k] !== false ? 'on' : ''}" data-act="cat" data-k="${k}" aria-label="${k} sounds" role="switch" aria-checked="${S.settings.cats[k] !== false}"><i></i></button>`;
  return `<h3>Settings</h3>
    <div class="srow"><div><div class="lbl">Name</div><div class="sub">${esc(S.profile.name || 'Not set')}${S.profile.rival ? ' · playing with ' + esc(S.profile.rival) : ''}</div></div><button class="btn btn-quiet" data-act="editprofile" style="min-height:40px;padding:0 14px;font-size:.82rem">Edit</button></div>
    <div class="srow"><div><div class="lbl">Sound</div><div class="sub">${S.settings.sound ? 'On · soft chimes, no buzzers' : 'Muted'}</div></div>
      <div class="vol">
        <input id="vol" type="range" min="0" max="100" value="${Math.round((S.settings.soundVol == null ? 0.6 : S.settings.soundVol) * 100)}" aria-label="Volume">
        <button class="iconbtn" data-act="mute" aria-label="Toggle sound" style="width:34px;height:34px">${S.settings.sound ? ICON_SOUND : ICON_MUTE}</button>
      </div>
    </div>
    <div class="srow"><div><div class="lbl">Interface sounds</div><div class="sub">Taps, sheets, plants</div></div>${sw('ui')}</div>
    <div class="srow"><div><div class="lbl">Answer sounds</div><div class="sub">Right, wrong, kept</div></div>${sw('answer')}</div>
    <div class="srow"><div><div class="lbl">Celebrations</div><div class="sub">Chapters, duels, records</div></div>${sw('reward')}</div>
    <div class="srow"><div><div class="lbl">Hear it</div><div class="sub">Play a short sample</div></div><button class="btn btn-quiet" data-act="soundtest" style="min-height:38px;padding:0 16px;font-size:.8rem">Test</button></div>
    <div class="srow"><div><div class="lbl">Appearance</div><div class="sub">Follows your phone unless you choose</div></div>${seg('theme', [['auto','Auto'],['light','Light'],['dark','Dark']])}</div>
    <div class="srow"><div><div class="lbl">Text size</div></div>${seg('size', [['md','Default'],['lg','Large'],['xl','Largest']])}</div>
    <div class="srow"><div><div class="lbl">Daily word mix</div><div class="sub">Useful words per stretch word</div></div>${seg('mix', [['useful','3:1'],['balanced','2:1'],['stretch','1:1']])}</div>
    <div class="srow"><div><div class="lbl">${met} words met</div><div class="sub">${days} day${days === 1 ? '' : 's'} of practice · ${info.kept} kept of ${info.span || 0} · best ${S.best || 0}</div></div></div>
    <div class="sheetfoot">
      <button class="btn btn-quiet block" data-act="export">Export a backup</button>
      <button class="btn btn-quiet block" data-act="import">Restore from a backup</button>
      <button class="btn btn-quiet block" data-act="reset" style="color:var(--rose)">Reset everything</button>
      <p style="font-size:.74rem;color:var(--ink-faint);text-align:center;line-height:1.6;margin-top:6px">Two rest days a week are built in. Missing one is not a failure — it is Tuesday.</p>
      <button class="btn btn-primary block" data-act="close">Done</button>
    </div>
    <input id="importFile" type="file" accept="application/json,.json" hidden>`;
}

/* ---------------- theme, speech, toast ---------------- */
function applyTheme(){
  const t = S.settings.theme;
  const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
}
function applySize(){ document.documentElement.dataset.size = S.settings.size || 'md'; }

function speak(text){
  if (!('speechSynthesis' in window)) return toast('No voice on this device');
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.85;
    const v = speechSynthesis.getVoices().find(v => /^en[-_]US/i.test(v.lang));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) { toast('Could not play the word'); }
}

let toastTimer;
function toast(msg){
  const el = $('#toast');
  el.textContent = msg; el.hidden = false;
  el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 2800);
}

/* ---------------- render ---------------- */
function updateBadge(){
  const n = dueList().length;
  const b = $('#dueBadge');
  b.textContent = n > 9 ? '9+' : String(n);
  b.hidden = n === 0;
}
function render(){
  const main = $('#main');
  if (!S.profile.onboarded){
    main.innerHTML = renderOnboarding();
    $$('.tab').forEach(t => t.classList.remove('on'));
    document.querySelector('.tabs').style.visibility = 'hidden';
    return;
  }
  document.querySelector('.tabs').style.visibility = '';
  if (ui.view === 'today') main.innerHTML = renderToday();
  else if (ui.view === 'review') main.innerHTML = renderReview();
  else if (ui.view === 'play') main.innerHTML = renderPlay();
  else if (ui.view === 'garden') main.innerHTML = renderGarden();
  else main.innerHTML = renderWords();
  $$('.tab').forEach(t => t.classList.toggle('on', t.dataset.view === ui.view));
  updateBadge();
}

function setView(v){
  ui.view = v;
  if (v === 'review'){ ui.rq = null; ui.quiz = null; ui.ri = 0; ui.answers = []; }
  render();
  window.scrollTo(0, 0);
}

/* ---------------- answer handling ---------------- */
function answerQuiz(i){
  const q = ui.quiz;
  if (!q || q.picked !== null) return;
  q.picked = i;
  const ok = i === q.answer;
  ui.answers[ui.ri] = { ok, lvl: cls(q.id).l, type: q.type };
  if (ok){ ui.combo = (ui.combo || 0) + 1; SFX.right(ui.combo); }
  else { ui.combo = 0; SFX.wrong(); requeue(q.id); }
  markWord(q.id, ok);
  render();
}
function answerTyped(text, revealOnly){
  const q = ui.quiz;
  if (!q || q.typed !== null) return;
  const w = BY_ID.get(q.id);
  const ok = !revealOnly && typedCorrect(text, w);
  q.typed = ok ? 'ok' : 'no';
  ui.answers[ui.ri] = { ok, lvl: cls(q.id).l, type: 'type' };
  if (ok){ ui.combo = (ui.combo || 0) + 1; SFX.right(ui.combo); }
  else { ui.combo = 0; SFX.wrong(); requeue(q.id); }
  markWord(q.id, ok);
  render();
}

/* ---------------- events ---------------- */
document.addEventListener('click', (e) => {
  const tab = e.target.closest('[data-view]');
  if (tab){ if (tab.dataset.view !== ui.view) SFX.tap(); setView(tab.dataset.view); return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;

  /* onboarding */
  if (act === 'obnext'){ readObInputs(); ui.ob = Math.min(2, ui.ob + 1); save(); render(); window.scrollTo(0,0); return; }
  if (act === 'obback'){ readObInputs(); ui.ob = Math.max(0, ui.ob - 1); render(); return; }
  if (act === 'obcue'){ readObInputs(); S.profile.cue = el.dataset.v; save(); render(); return; }
  if (act === 'obmix'){ readObInputs(); S.settings.mix = el.dataset.v; S.queue = null; S.ptr = 0; save(); render(); return; }
  if (act === 'obskip'){ S.profile.onboarded = true; save(); render(); return; }
  if (act === 'obdone'){ readObInputs(); S.profile.onboarded = true; save(); render(); toast('One word a day. That is the whole trick.'); return; }
  if (act === 'editprofile'){ closeSheet(); S.profile.onboarded = false; ui.ob = 0; render(); return; }

  /* today */
  if (act === 'speak'){ speak(el.dataset.w); el.classList.add('playing'); setTimeout(() => el.classList.remove('playing'), 900); return; }
  if (act === 'mute'){
    S.settings.sound = !S.settings.sound; save();
    renderMuteBtn();
    if (S.settings.sound) SFX.note();
    if ($('#vol')) openSheet(settingsSheet());
    toast(S.settings.sound ? 'Sound on' : 'Muted');
    return;
  }
  if (act === 'reveal'){ ui.revealedFor = S.today.id; SFX.page(); render(); return; }
  if (act === 'knew' || act === 'notyet'){
    const w = markWord(S.today.id, act === 'knew');
    ui.marked = { id: S.today.id, ok: act === 'knew', due: w.due };
    if (act === 'knew') SFX.keep(); else SFX.note();
    render();
    toast(act === 'knew' ? `Kept · back ${whenBack(w.due)}` : `Noted · back ${whenBack(w.due)}`);
    return;
  }
  if (act === 'more'){ ui.marked = null; ui.revealedFor = null; S.today = { date: todayISO(), id: nextId() }; SFX.page(); save(); render(); window.scrollTo(0,0); return; }
  if (act === 'review'){ setView('review'); return; }
  if (act === 'gotoday'){ setView('today'); return; }

  /* review */
  if (act === 'practise'){
    const pool = metList();
    const ids = shuffle(pool.length ? pool.map(w => w.w) : WORDS.map(w => w.w)).slice(0, 5);
    ui.rq = ids; ui.ri = 0; ui.answers = []; ui.quiz = null; render(); return;
  }
  if (act === 'opt'){ answerQuiz(Number(el.dataset.i)); return; }
  if (act === 'typesubmit'){ const inp = $('#typeinput'); answerTyped(inp ? inp.value : '', false); return; }
  if (act === 'typeshow'){ answerTyped('', true); return; }
  if (act === 'nextq'){
    const perfect = ui.ri + 1 >= ui.rq.length && ui.rq.every((id, i) => ui.answers[i] && ui.answers[i].ok);
    ui.ri++; ui.quiz = null;
    if (perfect) SFX.win();
    render(); window.scrollTo(0,0); return;
  }

  /* words / sheet */
  if (act === 'open'){
    const w = BY_ID.get(el.dataset.w);
    if (el.classList.contains('plot') && w) SFX.pluck(cls(w.w).l);
    if (w) openSheet(wordSheet(w));
    return;
  }
  if (act === 'close'){ closeSheet(); return; }
  if (act === 'sstart'){ const id = el.dataset.w; st(id).due = todayISO(); st(id).n = Math.max(1, st(id).n); save(); closeSheet(); toast('Added to your reviews'); render(); return; }
  if (act === 'sknew' || act === 'snotyet'){
    const w = markWord(el.dataset.w, act === 'sknew');
    openSheet(wordSheet(BY_ID.get(el.dataset.w)));
    toast(`Kept · back ${whenBack(w.due)}`);
    render(); return;
  }
  if (act === 'seasy' || act === 'shard'){
    const id = el.dataset.w; const w = st(id);
    w.n = Math.max(1, w.n);
    if (act === 'seasy'){ w.l = Math.min(INTERVALS.length - 1, (w.l || 0) + 2); }
    else { w.l = Math.max(0, (w.l || 0) - 2); }
    w.due = addDays(todayISO(), INTERVALS[w.l]); w.last = todayISO();
    save();
    openSheet(wordSheet(BY_ID.get(id)));
    toast(act === 'seasy' ? `Retired a little — back ${whenBack(w.due)}` : `Brought forward — back ${whenBack(w.due)}`);
    render(); return;
  }
  if (act === 'filter'){ ui.filter = el.dataset.f; render(); return; }

  /* play */
  if (act === 'play-pass'){ startDuel('pass'); return; }
  if (act === 'play-draft'){ startDuel('draft'); return; }
  if (act === 'play-endless'){ startDuel('endless'); return; }
  if (act === 'duel-begin'){
    try { history.replaceState(null, '', location.pathname + location.search); } catch (err) {}
    const d = ui.duel;
    startDuel('challenge', { words: d.words, from: d.from, target: d.target });
    return;
  }
  if (act === 'duel-opt'){
    const d = ui.duel; const q = d.quiz;
    if (!q || q.picked !== null) return;
    const i = Number(el.dataset.i);
    q.picked = i;
    const ok = i === q.answer;
    if (ok){ d.combo = (d.combo || 0) + 1; SFX.right(d.combo); }
    else { d.combo = 0; SFX.wrong(); }
    if (d.mode === 'endless'){
      if (ok) d.score++; else d.lives--;
    } else {
      d.answers[d.turn - 1][d.idx] = ok;
      if (ok) d.scores[d.turn - 1]++;
    }
    render(); return;
  }
  if (act === 'duel-next'){
    const d = ui.duel;
    if (d.mode === 'endless' && d.lives <= 0){ d.stage = 'result'; finishDuel(); render(); window.scrollTo(0,0); return; }
    d.idx++; d.quiz = null;
    if (d.idx >= d.words.length){
      if (d.mode === 'endless'){ d.round++; d.words = duelWords(); d.idx = 0; SFX.round(); }
      else if (d.mode === 'pass' && d.turn === 1){ d.stage = 'handoff'; d.idx = 0; }
      else { d.stage = 'result'; finishDuel(); }
    }
    render(); window.scrollTo(0,0); return;
  }
  if (act === 'duel-handoff'){ const d = ui.duel; d.turn = 2; d.stage = 'play'; d.idx = 0; d.quiz = null; SFX.pass(); render(); window.scrollTo(0,0); return; }
  if (act === 'duel-again'){
    const d = ui.duel;
    const mode = d.mode === 'challenge' ? 'draft' : d.mode;
    startDuel(mode, { from: d.from, target: d.target });
    return;
  }
  if (act === 'duel-link'){ openSheet(linkSheet(duelLink())); return; }
  if (act === 'duel-rematch'){
    const d = ui.duel;
    startDuel('draft', { from: d.from });
    return;
  }
  if (act === 'duel-quit'){ ui.duel = null; render(); window.scrollTo(0,0); return; }
  if (act === 'copy-link'){
    const t = $('#linktext');
    if (t){
      t.focus(); t.select();
      const done = () => toast('Link copied');
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(t.value).then(done).catch(() => { try { document.execCommand('copy'); done(); } catch (err) { toast('Press and hold to copy'); } });
      } else {
        try { document.execCommand('copy'); done(); } catch (err) { toast('Press and hold to copy'); }
      }
    }
    return;
  }
  if (act === 'share-link'){ navigator.share({ title: 'Wordloom duel', text: 'Five words. Beat my score.', url: duelLink() }).catch(() => {}); return; }

  /* settings */
  if (act === 'settings'){ openSheet(settingsSheet()); return; }
  if (act === 'cat'){
    const k = el.dataset.k;
    const on = !(S.settings.cats[k] !== false);
    S.settings.cats[k] = on;
    save();
    openSheet(settingsSheet());
    if (on){ if (k === 'answer') SFX.keep(); else if (k === 'reward') SFX.flourish(); else SFX.tap(); }
    return;
  }
  if (act === 'soundtest'){
    const prev = { ...S.settings.cats };
    S.settings.cats = { ui: true, answer: true, reward: true };
    S.settings.sound = true;
    renderMuteBtn();
    SFX.open();
    setTimeout(() => SFX.right(2), 240);
    setTimeout(() => SFX.flourish(), 620);
    setTimeout(() => { S.settings.cats = prev; }, 1800);
    return;
  }
  if (act === 'set'){
    const k = el.dataset.k, v = el.dataset.v;
    S.settings[k] = v; save();
    if (k === 'theme') applyTheme();
    if (k === 'size') applySize();
    if (k === 'mix'){ S.queue = null; S.ptr = 0; }
    openSheet(settingsSheet()); return;
  }
  if (act === 'export'){
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `wordloom-${todayISO()}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast('Backup saved');
    return;
  }
  if (act === 'import'){ const f = $('#importFile'); if (f) f.click(); return; }
  if (act === 'reset'){
    if (!confirm('Erase all progress on this device? This cannot be undone.')) return;
    try { localStorage.removeItem(STORE); } catch (err) {}
    S = fresh(); ui.marked = null; ui.revealedFor = null; ui.duel = null; ui.ob = 0;
    ensureToday(); applyTheme(); applySize(); closeSheet(); render();
    toast('Starting over');
    return;
  }
});

document.addEventListener('submit', (e) => {
  if (e.target && e.target.matches('[data-act="typeform"]')){ e.preventDefault(); answerTyped($('#typeinput') ? $('#typeinput').value : '', false); }
});

document.addEventListener('change', (e) => {
  if (e.target && e.target.id === 'vol'){ SFX.note(); return; }
  if (e.target && e.target.id === 'importFile'){
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const p = JSON.parse(rd.result);
        if (!p || p.v !== 1 || typeof p.words !== 'object') throw new Error('bad');
        S = p;
        save(); applyTheme(); applySize(); closeSheet();
        ui.marked = null; ui.revealedFor = null; ui.rq = null;
        ensureToday(); render();
        toast('Backup restored');
      } catch (err) { toast('That file does not look like a backup'); }
    };
    rd.readAsText(f);
  }
});

$('#scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.settings.theme === 'auto') applyTheme(); });

document.addEventListener('input', (e) => {
  if (e.target && e.target.id === 'vol'){
    S.settings.soundVol = Number(e.target.value) / 100;
    if (!S.settings.sound){ S.settings.sound = true; renderMuteBtn(); }
    save();
    if (master) master.gain.value = S.settings.soundVol;
    else audio();
    return;
  }
  if (e.target && e.target.id === 'q'){
    ui.q = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const box = $('#q');
    if (box){ box.focus(); try { box.setSelectionRange(pos, pos); } catch (err) {} }
  }
});

/* ---------------- boot ---------------- */
S = DEMO ? demoState() : load();
if (DEMO) document.documentElement.dataset.demo = '1';
applyTheme(); applySize();
renderMuteBtn();
ensureToday();

/* an incoming challenge lives in the URL hash */
function readChallenge(){
  const m = /[#&]d=([A-Za-z0-9\-_]+)/.exec(location.hash || '');
  if (!m) return false;
  try {
    const p = JSON.parse(unb64u(m[1]));
    if (!p || !Array.isArray(p.w)) return false;
    const words = p.w.filter(id => BY_ID.has(id)).slice(0, 5);
    if (words.length < 5) return false;
    ui.duel = { mode: 'challenge', stage: 'setup', words, idx: 0, turn: 1, scores: [0,0], answers: [[],[]], quiz: null, from: p.f || 'Someone', target: Number(p.s) || 0 };
    ui.view = 'play';
    return true;
  } catch (e) { return false; }
}
const challenged = readChallenge();

render();
if (!challenged){
  const vp = /[?&]view=(today|review|play|garden|words)/.exec(location.search);
  if (vp) setView(vp[1]);
  const sp = /[?&]sheet=([a-z]+)/.exec(location.search);
  if (sp && BY_ID.has(sp[1])) openSheet(wordSheet(BY_ID.get(sp[1])));

  const dp = /[?&]duel=(pass|draft|result|endless)/.exec(location.search);
  if (DEMO && dp){
    if (dp[1] !== 'result') startDuel(dp[1]);
    else { startDuel('pass'); ui.duel.scores = [4, 2]; ui.duel.stage = 'result'; finishDuel(); render(); }
  }
}

if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
})();
</script>
</body>
</html>
